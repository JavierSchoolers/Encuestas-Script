# .github/workflows/sync-encuestas.yml
# Sincroniza EvolCampus → Monday todos los días y refresca el dashboard.
# Ejecuta:  evolcampus_monday_sync.py --sync   (que a su vez lanza
#           link_encuestas_alumnos.py al terminar).

name: Sync encuestas EvolCampus → Monday

on:
  schedule:
    # GitHub usa horario UTC. '0 0 * * *' = 00:00 UTC TODOS los días (L-D).
    # En España: 01:00 en invierno (CET) / 02:00 en verano (CEST).
    - cron: '0 0 * * *'
  workflow_dispatch: {}    # botón para lanzarlo a mano desde la pestaña "Actions"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar sync
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
        run: python scripts/evolcampus_monday_sync.py --sync

      - name: Refrescar el dashboard (reconstruir encuestas en Netlify)
        run: |
          curl -fsS -X POST https://rrhh.schoolers.io/.netlify/functions/monday-encuestas-build-background || true
