# .github/workflows/sync-encuestas.yml
# Sincroniza EvolCampus → Monday todos los días (objetivo: 00:30 hora de España).
# Ejecuta DOS syncs (cada uno a su board) + asignación de empresa + refresco:
#   1) evolcampus_monday_sync_cursos.py --sync  → board Cursos  (5094417029)
#   2) evolcampus_monday_sync.py        --sync  → board EGH     (5093144633)
#      (su sync interno lanza link_encuestas_alumnos SOLO con --board egh).
#   3) link_encuestas_alumnos.py --board cursos → "Alumno (rel)" + "Empresa -
#      dashboard" en el board Cursos (el paso 2 no lo hace). "Cuenta empresa" es un
#      mirror de esa relación → se rellena solo en cuanto la relación existe.
#   4) link_marca_matriculas.py  → "Empresa - dashboard" con la Marca real (Matrículas).
#   5) sync_mirror_empresa.py    → copia la empresa del board Alumnos a "Cuenta empresa".
#   6) POST a Netlify para reconstruir el JSON de encuestas que lee el dashboard.

name: Sync encuestas EvolCampus → Monday

on:
  schedule:
    # GitHub usa horario UTC y NO ajusta el horario de verano (DST).
    # Objetivo: 00:30 en España, TODOS los días (L–D).
    #   '30 22 * * *' = 22:30 UTC = 00:30 en verano (CEST) / 23:30 en invierno (CET).
    # (Si prefieres 00:30 exacto en INVIERNO usa '30 23 * * *' → en verano sería 01:30.)
    - cron: '30 22 * * *'
  workflow_dispatch:       # botón para lanzarlo a mano desde la pestaña "Actions"
    inputs:
      force:
        description: 'Backfill: reprocesar grupos ignorando el salto "sin cambios" por fecha (recoge respuestas tardías).'
        type: boolean
        default: false
      course:
        description: 'Acotar el backfill a un curso (texto, ej: LGTBI). Vacío = todos. Con esto el backfill tarda minutos.'
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # red de seguridad: falla limpio antes del corte duro de 6h de GitHub
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Credenciales SIEMPRE desde Secrets (Settings → Secrets and variables → Actions).
      # Los .py abortan con error claro si falta alguna.
      - name: 1) Sync CURSOS (no-EGH) → board 5094417029
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
          SKIP_DASHBOARD_REGEN: '1'   # en CI el JSON lo reconstruye Netlify (paso 3)
        run: python scripts/evolcampus_monday_sync_cursos.py --sync ${{ inputs.force && '--force' || '' }} ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }}

      - name: 2) Sync EGH → board 5093144633 (su sync interno enlaza SOLO el board EGH)
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
        run: python scripts/evolcampus_monday_sync.py --sync ${{ inputs.force && '--force' || '' }} ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }}

      # El sync EGH (paso 2) lanza link_encuestas_alumnos SOLO con --board egh, así que
      # el board CURSOS nunca recibe "Alumno (rel)" ni "Empresa - dashboard". Lo hacemos
      # aquí explícitamente. Sin esto, "Alumno (rel)" y el mirror "Cuenta empresa" quedan
      # vacíos en Cursos y el paso 5 (sync_mirror) no encuentra relaciones que copiar.
      - name: 3) Enlazar Alumno (rel) + Empresa en board CURSOS (DNI → Alumnos)
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python scripts/link_encuestas_alumnos.py --board cursos

      - name: 4) Asignar empresa por Marca real (Matrículas → boards de Encuestas)
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python scripts/link_marca_matriculas.py

      - name: 5) Sincronizar 'Cuenta empresa' (espejo Alumnos → columna de texto)
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python scripts/sync_mirror_empresa.py

      - name: 6) Refrescar el dashboard (reconstruir encuestas en Netlify)
        if: always()   # refresca aunque algún paso haya fallado: sube lo que sí se escribió
        run: |
          curl -fsS -X POST https://rrhh.schoolers.io/.netlify/functions/monday-encuestas-build-background || true
