# .github/workflows/export-encuestas-excel.yml
# Exporta las encuestas de actividad a un Excel con la PLANTILLA de Monday, para
# subirlas manualmente (p. ej. programas ya finalizados que el sync diario salta).
# NO escribe en Monday: solo lee EvolCampus (+ Matrículas para filtrar por empresa)
# y deja el .xlsx como ARTIFACT descargable de la ejecución.
#
# Uso: Actions → "Export encuestas (Excel plantilla Monday)" → Run workflow,
#      rellena empresa / curso / niveles y descarga el artifact al terminar.

name: Export encuestas (Excel plantilla Monday)

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Empresa/marca a exportar (vacío = todas). Ej: Garden Hotels'
        type: string
        default: 'Garden Hotels'
      course:
        description: 'Acotar a un curso (texto, contiene). Vacío = todos los cursos.'
        type: string
        default: ''
      niveles:
        description: 'Niveles a incluir (coma): encuesta,modulo,programa'
        type: string
        default: 'encuesta,modulo,programa'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Excel de encuestas
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
        run: |
          python -u scripts/evolcampus_monday_sync_cursos.py \
            --export-excel "encuestas-export.xlsx" \
            ${{ inputs.company && format('--company "{0}"', inputs.company) || '' }} \
            ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }} \
            --niveles "${{ inputs.niveles }}"

      - name: Subir el Excel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: encuestas-export
          path: encuestas-export.xlsx
          if-no-files-found: warn
