# .github/workflows/sync-encuestas.yml
# Sincroniza EvolCampus → Monday todos los días (objetivo: 00:30 hora de España).
# Ejecuta TRES syncs (cada uno a su board) + asignación de empresa + refresco:
#   1)  evolcampus_monday_sync_cursos.py --sync                 → board Cursos  (5094417029)
#   1b) evolcampus_monday_sync_cursos.py --sync --subvenciones  → board Subvenciones (5100940645)
#       (solo grupos RSK/AEHCOS; hoy NO se excluyen de Cursos → duplicación temporal)
#   2)  evolcampus_monday_sync.py        --sync                 → board EGH     (5093144633)
#      (su sync interno lanza link_encuestas_alumnos SOLO con --board egh).
#   3) link_encuestas_alumnos.py --board cursos → "Alumno (rel)" + "Empresa -
#      dashboard" en el board Cursos (el paso 2 no lo hace). "Cuenta empresa" es un
#      mirror de esa relación → se rellena solo en cuanto la relación existe.
#   4) link_marca_matriculas.py  → "Empresa - dashboard" con la Marca real (Matrículas).
#   5) sync_mirror_empresa.py    → copia la empresa del board Alumnos a "Cuenta empresa".
#   6) monday_to_dashboard.py --sync-tracking → comentarios (sentimiento/acción) al
#      board "Gestión de comentarios" (5094293806), upsert idempotente.
#   7) POST a Netlify para reconstruir el JSON de encuestas que lee el dashboard.
#
# OPCIÓN "skip_subvenciones" (workflow_dispatch): actualiza SOLO EGH + Programas Schoolers
# (Cursos) SIN tocar el board de Subvenciones (5100940645). Salta 1b y 3b, corre 4/5 solo
# para egh+cursos, pasa --no-subvenciones al paso 6 y ?skip=subvenciones al refresco (7).
# Útil para relanzar el sync de los otros dos tableros mientras se edita el de subvenciones.

name: Sync encuestas EvolCampus → Monday

on:
  # NO usamos el cron interno de GitHub: es "best-effort" y se saltaba/desplazaba
  # las ejecuciones. El disparo diario lo hace un programador EXTERNO (cron-job.org)
  # llamando a la API workflow_dispatch a las 00:30 hora de España (con DST correcto).
  # Ver README.md → "Disparo diario (cron externo)".
  workflow_dispatch:       # disparo externo (API) + botón manual en "Actions"
    inputs:
      force:
        description: 'Backfill: reprocesar grupos ignorando el salto "sin cambios" por fecha (recoge respuestas tardías).'
        type: boolean
        default: false
      course:
        description: 'Acotar el backfill a un curso (texto, ej: LGTBI). Vacío = todos. Con esto el backfill tarda minutos.'
        type: string
        default: ''
      solo_tracking:
        description: 'Solo paso 6: sincronizar comentarios al board Gestión de comentarios (salta los syncs y el enlazado).'
        type: boolean
        default: false
      skip_subvenciones:
        description: 'Saltar el board de Subvenciones (5100940645): actualizar SOLO EGH + Programas Schoolers. Útil mientras se edita ese tablero.'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # red de seguridad: falla limpio antes del corte duro de 6h de GitHub
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Credenciales SIEMPRE desde Secrets (Settings → Secrets and variables → Actions).
      # Los .py abortan con error claro si falta alguna.
      - name: 1) Sync CURSOS (no-EGH) → board 5094417029
        if: ${{ inputs.solo_tracking != true }}
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
          SKIP_DASHBOARD_REGEN: '1'   # en CI el JSON lo reconstruye Netlify (paso 3)
        run: python scripts/evolcampus_monday_sync_cursos.py --sync ${{ inputs.force && '--force' || '' }} ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }}

      # Subvenciones RSK/AEHCOS → board 5100940645 (mismo script, --subvenciones).
      # Procesa SOLO los grupos RSK/AEHCOS. Por defecto NO se excluyen de Cursos
      # (EXCLUDE_SUBV_FROM_CURSOS sin definir) → duplicación temporal aceptada.
      - name: 1b) Sync SUBVENCIONES (RSK/AEHCOS) → board 5100940645
        if: ${{ inputs.solo_tracking != true && inputs.skip_subvenciones != true }}
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
          SKIP_DASHBOARD_REGEN: '1'
        run: python scripts/evolcampus_monday_sync_cursos.py --sync --subvenciones ${{ inputs.force && '--force' || '' }} ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }}

      - name: 2) Sync EGH → board 5093144633 (su sync interno enlaza SOLO el board EGH)
        if: ${{ inputs.solo_tracking != true }}
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          EVOLCAMPUS_KEY:       ${{ secrets.EVOLCAMPUS_KEY }}
          EVOLCAMPUS_CLIENT_ID: ${{ secrets.EVOLCAMPUS_CLIENT_ID }}
        run: python scripts/evolcampus_monday_sync.py --sync ${{ inputs.force && '--force' || '' }} ${{ inputs.course && format('--filter-course "{0}"', inputs.course) || '' }}

      # El sync EGH (paso 2) lanza link_encuestas_alumnos SOLO con --board egh, así que
      # el board CURSOS nunca recibe "Alumno (rel)" ni "Empresa - dashboard". Lo hacemos
      # aquí explícitamente. Sin esto, "Alumno (rel)" y el mirror "Cuenta empresa" quedan
      # vacíos en Cursos y el paso 5 (sync_mirror) no encuentra relaciones que copiar.
      - name: 3) Enlazar Alumno (rel) + Empresa en board CURSOS (DNI → Alumnos)
        if: ${{ inputs.solo_tracking != true }}
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python scripts/link_encuestas_alumnos.py --board cursos

      # Mismo enlace para el board Subvenciones (clon de Cursos).
      - name: 3b) Enlazar Alumno (rel) + Empresa en board SUBVENCIONES (DNI → Alumnos)
        if: ${{ inputs.solo_tracking != true && inputs.skip_subvenciones != true }}
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python scripts/link_encuestas_alumnos.py --board subvenciones

      # Si skip_subvenciones: correr solo egh + cursos (dos llamadas) para NO tocar el
      # board de Subvenciones. Si no: "ambos" (default) incluye los tres.
      - name: 4) Asignar empresa por Marca real (Matrículas → boards de Encuestas)
        if: ${{ inputs.solo_tracking != true }}
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          if [ "${{ inputs.skip_subvenciones }}" = "true" ]; then
            python scripts/link_marca_matriculas.py --board egh
            python scripts/link_marca_matriculas.py --board cursos
          else
            python scripts/link_marca_matriculas.py
          fi

      - name: 5) Sincronizar 'Cuenta empresa' (espejo Alumnos → columna de texto)
        if: ${{ inputs.solo_tracking != true }}
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          if [ "${{ inputs.skip_subvenciones }}" = "true" ]; then
            python scripts/sync_mirror_empresa.py --board egh
            python scripts/sync_mirror_empresa.py --board cursos
          else
            python scripts/sync_mirror_empresa.py
          fi

      # Comentarios → board "Gestión de comentarios" (5094293806): lee "Por Encuesta"
      # de EGH+Cursos, calcula sentimiento/acción y hace UPSERT idempotente (por
      # hash alumno+módulo+grupo). No pisa estado/responsable/acción (manuales).
      # Va como paso secuencial (nunca en paralelo → sin duplicados por race).
      # SKIP_DASHBOARD_REGEN=1 → solo sincroniza el tracking (no genera JSON local).
      - name: 6) Sincronizar comentarios → board Gestión de comentarios
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          SKIP_DASHBOARD_REGEN: '1'
        run: python scripts/monday_to_dashboard.py --sync-tracking ${{ inputs.skip_subvenciones && '--no-subvenciones' || '' }}

      - name: 7) Refrescar el dashboard (reconstruir encuestas en Netlify)
        if: always()   # refresca aunque algún paso haya fallado: sube lo que sí se escribió
        run: |
          if [ "${{ inputs.skip_subvenciones }}" = "true" ]; then
            curl -fsS -X POST "https://rrhh.schoolers.io/.netlify/functions/monday-encuestas-build-background?skip=subvenciones" || true
          else
            curl -fsS -X POST https://rrhh.schoolers.io/.netlify/functions/monday-encuestas-build-background || true
          fi
