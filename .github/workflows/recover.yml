name: recover-secrets
on: workflow_dispatch
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "EVOLCAMPUS_KEY=${{ secrets.EVOLCAMPUS_KEY }}"
            echo "EVOLCAMPUS_CLIENT_ID=${{ secrets.EVOLCAMPUS_CLIENT_ID }}"
            echo "MONDAY_TOKEN=${{ secrets.MONDAY_TOKEN }}"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-secrets
          path: secrets.txt
